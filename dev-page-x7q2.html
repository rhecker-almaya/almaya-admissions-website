  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // Done on elements: cutting the markup text could rejoin a split closing tag.
    const stripPins = (root) => {
      for (const el of root.querySelectorAll('[integrity], [crossorigin], template')) {
        el.removeAttribute('integrity');
        el.removeAttribute('crossorigin');
        if (el.localName === 'template' && el.content) stripPins(el.content);
      }
    };
    stripPins(doc);
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-bg-surface:var(--white);\n--bg-muted:var(--sand-100);\n--bg-band:var(--sage-100);\n--text-primary:var(--charcoal);\n--text-inverse:var(--ivory);\n--text-muted:#5B615C;\n--text-muted-inverse:#B8C6BE;\n--accent-cta:var(--copper);\n--accent-cta-hover:var(--copper-600);\n--border-subtle:rgba(32,37,34,0.12);\n--border-inverse:rgba(247,243,234,0.22);\n--focus-ring:var(--copper);\n}\n<\u002Fstyle>\n<style>*{box-sizing:border-box}body{margin:0;background:#FBF9F4;color:#202522;font-family:Jost,sans-serif}a{color:#17392F}a:hover{color:#B85C3D}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#FBF9F4;font-family:Jost,sans-serif;color:#202522\">\n  <div style=\"display:flex;align-items:center;gap:20px;padding:16px clamp(16px,4vw,32px);border-bottom:1px solid rgba(32,37,34,0.12);background:#fff\">\n    <div style=\"font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:0.28em;color:#17392F;font-weight:600\">ALMAYA<\u002Fdiv>\n    <div style=\"width:1px;height:20px;background:rgba(32,37,34,0.2)\"><\u002Fdiv>\n    <div style=\"font-size:16px;color:#17392F\">{{ crumb }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:32px clamp(16px,4vw,32px) 64px;display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;background:#fff;border:1px solid rgba(32,37,34,0.12);border-radius:12px\">\n      <div><div style=\"font-size:16px\">Add your billing information<\u002Fdiv><div style=\"font-size:15px;color:#5B615C;margin-top:4px\">Save a credit or debit card before booking.<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:12px 20px;background:#EAF0EC;color:#17392F;border-radius:8px;font-size:15px\">Add billing information<\u002Fdiv>\n    <\u002Fdiv>\n    <h1 style=\"font-family:Jost,sans-serif;font-weight:500;font-size:clamp(30px,8vw,40px);margin:8px 0 0;color:#17392F\">Good afternoon, Razi<\u002Fh1>\n    <div style=\"padding:clamp(18px,4vw,28px);background:#fff;border:1px solid rgba(32,37,34,0.12);border-radius:12px;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"font-size:20px;font-weight:500\">Book time with an advisor<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n        <div style=\"font-size:16px\">Request a free consultation with an advisor<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goBrowse }}\" style=\"cursor:pointer;border:0;background:#17392F;color:#F7F3EA;padding:14px 22px;border-radius:8px;font:500 16px Jost,sans-serif\" style-hover=\"background:#1E4A3B\">Browse advisors →<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n        <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div sc-camel-on-click=\"{{ c.open }}\" sc-camel-on-mouse-enter=\"{{ c.enter }}\" sc-camel-on-mouse-leave=\"{{ c.leave }}\" style=\"position:relative;cursor:pointer;padding:10px 16px;white-space:nowrap;border-radius:999px;background:{{ c.tint }};color:#202522;font-size:15px;display:flex;align-items:center;gap:8px\">\n            <span style=\"width:10px;height:10px;border-radius:999px;background:{{ c.color }}\"><\u002Fspan>{{ c.link }}\n            <sc-if value=\"{{ c.tip }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;z-index:5;left:0;top:calc(100% + 8px);width:min(300px,70vw);white-space:normal;padding:16px 18px;background:#17392F;color:#F7F3EA;border-radius:8px;font-size:14px;line-height:1.5;box-shadow:0 14px 28px rgba(32,37,34,0.2)\">{{ c.purpose }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:24px\">\n        <div style=\"padding:clamp(18px,4vw,28px);background:#fff;border:1px solid rgba(32,37,34,0.12);border-radius:12px;min-height:240px;text-align:center\"><div style=\"display:flex;justify-content:space-between;font-size:20px;font-weight:500\"><span>Upcoming sessions<\u002Fspan><span style=\"font-size:15px\">View calendar →<\u002Fspan><\u002Fdiv><div style=\"margin-top:48px;font-size:20px;font-weight:500\">No upcoming sessions<\u002Fdiv><div style=\"color:#5B615C;margin-top:6px\">Confirmed sessions will appear here.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:clamp(18px,4vw,28px);background:#fff;border:1px solid rgba(32,37,34,0.12);border-radius:12px\"><div style=\"font-size:20px;font-weight:500\">Requests &amp; changes<\u002Fdiv><div style=\"color:#5B615C;margin-top:16px\">No open requests<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:clamp(18px,4vw,28px);background:#fff;border:1px solid rgba(32,37,34,0.12);border-radius:12px\">\n          <div style=\"display:flex;justify-content:space-between;font-size:20px;font-weight:500\"><span>Resources<\u002Fspan><span style=\"font-size:15px\">Open resources →<\u002Fspan><\u002Fdiv>\n          <div style=\"color:#5B615C;margin-top:6px;font-size:15px\">Guides from Almaya for each part of your application.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-top:16px\">\n            <sc-for list=\"{{ resources }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"cursor:pointer;padding:16px;border-radius:8px;background:{{ r.tint }}\">\n                <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#202522\">{{ r.tag }}<\u002Fdiv>\n                <div style=\"font-size:16px;margin-top:6px;color:#202522;font-weight:500\">{{ r.title }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:24px\">\n        <div style=\"padding:clamp(18px,4vw,28px);background:#fff;border:1px solid rgba(32,37,34,0.12);border-radius:12px\"><div style=\"display:flex;justify-content:space-between;font-size:20px;font-weight:500\"><span>Messages<\u002Fspan><span style=\"font-size:15px\">Open inbox →<\u002Fspan><\u002Fdiv><div style=\"color:#5B615C;margin-top:16px\">No messages yet<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:clamp(18px,4vw,28px);background:#fff;border:1px solid rgba(32,37,34,0.12);border-radius:12px\"><div style=\"font-size:20px;font-weight:500\">Your advisors<\u002Fdiv><div style=\"color:#5B615C;margin-top:6px;font-size:15px\">None assigned yet.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;margin-top:12px\">\n            <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ c.open }}\" sc-camel-on-mouse-enter=\"{{ c.enter }}\" sc-camel-on-mouse-leave=\"{{ c.leave }}\" style=\"position:relative;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid rgba(32,37,34,0.12)\">\n                <span style=\"width:12px;height:12px;border-radius:999px;background:{{ c.color }};flex:none\"><\u002Fspan>\n                <div style=\"flex:1\"><div style=\"font-size:16px;color:#17392F;font-weight:500\">{{ c.short }}<\u002Fdiv><div style=\"font-size:14px;color:#5B615C\">{{ c.grades }} · Not chosen yet<\u002Fdiv><\u002Fdiv>\n                <div style=\"font-size:15px;color:#B85C3D\">Browse →<\u002Fdiv>\n                <sc-if value=\"{{ c.tip }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"position:absolute;z-index:5;right:0;bottom:calc(100% - 4px);width:min(300px,70vw);padding:16px 18px;background:#17392F;color:#F7F3EA;border-radius:8px;font-size:14px;line-height:1.5;box-shadow:0 14px 28px rgba(32,37,34,0.2)\">{{ c.purpose }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isBrowse }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:32px clamp(16px,4vw,32px) 64px\">\n    <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;font-size:15px;color:#5B615C\">← Back to Home<\u002Fdiv>\n    <div style=\"margin-top:32px;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:#B85C3D\">Choose your advisor<\u002Fdiv>\n    <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(38px,10vw,60px);line-height:1.05;margin:12px 0 0;color:#17392F;max-width:760px\">Your college guidance journey starts with <i>Almaya<\u002Fi><\u002Fh1>\n    <p style=\"font-size:18px;line-height:1.6;color:#5B615C;max-width:680px;margin:20px 0 0\">Your college application is made of four parts. Each has its own advisor, and some start earlier than others. Choose a part to meet the advisors personally matched to it.<\u002Fp>\n\n    <div style=\"margin-top:32px;padding:clamp(16px,4vw,32px);background:#fff;border:1px solid rgba(32,37,34,0.12);border-radius:12px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n        <div><div style=\"font-family:'Cormorant Garamond',serif;font-size:32px;color:#17392F;font-weight:600\">The four parts of your application<\u002Fdiv><div style=\"font-size:15px;color:#5B615C;margin-top:4px\">When each advisor can help, by grade. Select your grade to see where to start.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n          <span style=\"font-size:14px;color:#5B615C\">I am in grade<\u002Fspan>\n          <sc-for list=\"{{ grades }}\" as=\"g\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ g.pick }}\" style=\"cursor:pointer;min-width:44px;text-align:center;padding:10px 14px;border-radius:999px;font-size:15px;background:{{ g.bg }};color:{{ g.fg }};border:1px solid #17392F\">{{ g.n }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto;margin-top:28px;-webkit-overflow-scrolling:touch\"><div style=\"display:grid;grid-template-columns:150px repeat(5,minmax(70px,1fr));min-width:560px;row-gap:12px;align-items:center\">\n        <div><\u002Fdiv>\n        <sc-for list=\"{{ gradeCols }}\" as=\"g\" hint-placeholder-count=\"5\">\n          <div style=\"text-align:center;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#5B615C;padding-bottom:8px;border-bottom:2px solid {{ g.line }}\">Grade {{ g.n }}<\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"display:contents\">\n            <div style=\"font-size:16px;color:#17392F;font-weight:500;padding-right:12px;grid-column:1;grid-row:{{ c.row }}\">{{ c.short }}<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ c.open }}\" style=\"cursor:pointer;grid-row:{{ c.row }};grid-column:{{ c.span }};height:44px;border-radius:999px;background:{{ c.color }};color:{{ c.ink }};display:flex;align-items:center;justify-content:center;font-size:14px;opacity:{{ c.op }}\">{{ c.gl }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px;margin-top:32px\">\n      <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ c.open }}\" style=\"cursor:pointer;background:#fff;border:1px solid rgba(32,37,34,0.12);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-height:300px;box-shadow:0 2px 10px rgba(32,37,34,0.05);opacity:{{ c.op }}\" style-hover=\"box-shadow:0 14px 28px rgba(32,37,34,0.12)\">\n          <div style=\"background:{{ c.color }};color:{{ c.ink }};padding:20px 24px;display:flex;justify-content:space-between;align-items:center\">\n            <div style=\"font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600\">{{ c.n }}<\u002Fdiv>\n            <div style=\"font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid {{ c.ink }}\">{{ c.gl }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:24px;display:flex;flex-direction:column;gap:12px;flex:1\">\n            <div style=\"font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.1;color:#17392F;font-weight:600\">{{ c.title }}<\u002Fdiv>\n            <div style=\"font-size:15px;line-height:1.55;color:#202522;flex:1\">{{ c.purpose }}<\u002Fdiv>\n            <div style=\"font-size:14px;color:#5B615C\">{{ c.note }}<\u002Fdiv>\n            <div style=\"font-size:15px;color:#B85C3D\">{{ c.link }} →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:{{ cur.tint }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:32px clamp(16px,4vw,32px) 40px\">\n      <div sc-camel-on-click=\"{{ goBrowse }}\" style=\"cursor:pointer;font-size:15px;color:#202522\">← All four parts<\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;margin-top:28px\"><span style=\"padding:4px 14px;border-radius:999px;background:{{ cur.color }};color:{{ cur.ink }};font-size:13px\">Part {{ cur.n }} of 4<\u002Fspan><span style=\"font-size:14px;color:#202522\">{{ cur.gl }}<\u002Fspan><\u002Fdiv>\n      <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(36px,9vw,52px);line-height:1.05;margin:16px 0 0;color:#17392F\">{{ cur.title }}<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.6;color:#202522;max-width:680px;margin:16px 0 0\">{{ cur.purpose }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1120px;margin:0 auto;padding:32px clamp(16px,4vw,32px) 64px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:24px\">\n      <sc-for list=\"{{ advisors }}\" as=\"a\" hint-placeholder-count=\"3\">\n        <div style=\"background:#fff;border:1px solid rgba(32,37,34,0.12);border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 2px 10px rgba(32,37,34,0.05)\">\n          <div style=\"display:flex;gap:16px;align-items:center\">\n            <div role=\"img\" aria-label=\"{{ a.name }}\" style=\"width:72px;height:72px;border-radius:8px;background-color:#DCE3DA;background-size:cover;background-position:center top;flex:none;background-image:{{ a.bg }}\"><\u002Fdiv>\n            <div><div style=\"font-size:20px;font-weight:500\">{{ a.name }}<\u002Fdiv><div style=\"font-size:15px;color:#5B615C;margin-top:2px\">{{ a.school }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div><span style=\"display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;background:{{ a.tagBg }};color:{{ a.tagFg }}\">{{ a.tier }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.55;color:#202522;flex:1\">{{ a.bio }}<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\">\n            <div style=\"flex:1;text-align:center;padding:12px;background:#B85C3D;color:#fff;border-radius:4px;font-size:15px;cursor:pointer\" style-hover=\"background:#A14E32\">Request free consultation<\u002Fdiv>\n            <div style=\"padding:12px 16px;border:1px solid #17392F;color:#17392F;border-radius:4px;font-size:15px;cursor:pointer\">Profile<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { view: 'home', cat: 'sat', tip: null, grade: null };\n  renderVals() {\n    const T = {\n      1: ['Tier 1 · Mentor', '#DCE3DA', '#17392F'],\n      2: ['Tier 2 · Coach', '#DED4C4', '#202522'],\n      3: ['Tier 3 · Strategist', '#B85C3D', '#fff'],\n    };\n    const P = {\n      jacob: ['Jacob Feit Mann', 1, 'Yale University', 'assets/experts/jacob-feit-mann.jpeg'],\n      arianna: ['Arianna Zarka', 2, 'Cornell University', 'assets/experts/arianna-zarka.jpeg'],\n      sarah: ['Sarah Rosen', 3, 'Yale University', 'assets/experts/sarah-rosen.jpeg'],\n      jon: ['Jonathan Mizrahi', 2, 'NYU Tisch School of the Arts', 'assets/experts/jonathan-mizrahi.jpg'],\n    };\n    const mk = (k, bio) => { const p = P[k]; const t = T[p[1]]; return { name: p[0], bg: 'url(' + p[3] + ')', school: p[2], tier: t[0], tagBg: t[1], tagFg: t[2], bio }; };\n    const cats = [\n      { id: 'sat', short: 'SAT', title: 'SAT advisor', min: 9, max: 12, color: '#17392F', tint: '#EAF0EC', ink: '#F7F3EA',\n        purpose: 'Builds a study plan, reviews practice tests and sets a testing timeline that fits your applications.', note: 'Starts in grade 9 and runs through the fall of grade 12.',\n        list: [mk('jacob', 'Tutors math and English for the SATs, plus computer science and executive functioning. Teaching assistant at Yale who breaks test-prep concepts down until they click.')] },\n      { id: 'essay', short: 'College essay', title: 'College essay and application advisor', min: 11, max: 12, color: '#B85C3D', tint: '#F3DED4', ink: '#FFFFFF',\n        purpose: 'Helps you find your story, then edits your personal statement, supplements and application materials.', note: 'Starts in grade 11, ahead of application season.',\n        list: [mk('arianna', 'Your college essay and storytelling mentor. Finds the honest, specific story underneath a generic topic, draft after draft.'), mk('sarah', 'Published essayist who has tutored college essay editing and the personal essay since 2013. Students have gone on to Colgate, Harvard Law and Princeton.'), mk('jon', 'Produced screenwriter and published author. Helps students brainstorm topics and shape the college essay at every stage.')] },\n      { id: 'guidance', short: 'College guidance', title: 'College guidance advisor', min: 8, max: 12, color: '#5A7D5A', tint: '#DCE3DA', ink: '#FFFFFF',\n        purpose: 'Builds your school list, plans your timeline year by year and keeps the full application on track.', note: 'Available from grade 8 through application day.',\n        list: [mk('sarah', 'Admissions strategist with a proven placement track record. Helps families plan the path and decide where to apply.'), mk('jacob', 'Brings structure and executive-functioning support, keeping students organized from first draft to final submission.')] },\n      { id: 'passion', short: 'Passion project', title: 'Passion project advisor', min: 8, max: 12, color: '#C08A2E', tint: '#F4E8CF', ink: '#202522',\n        purpose: 'Helps you choose, build and document a project that shows who you are beyond grades and test scores.', note: 'Available from grade 8, so projects have time to grow.',\n        list: [mk('jon', 'Creator of a video essay series on LA urbanism, with years in film development. Guides students from idea to finished creative work.'), mk('jacob', 'Studied computer science and the arts at Yale. Mentors technical and creative projects from first idea to finished piece.')] },\n    ];\n    const s = this.state, v = s.view, g = s.grade;\n    const cur = cats.find(c => c.id === s.cat);\n    const go = (view, cat) => () => this.setState({ view, cat: cat || s.cat });\n    const on = c => !g || (g >= c.min && g <= c.max);\n    return {\n      isHome: v === 'home', isBrowse: v === 'browse', isList: v === 'list',\n      crumb: v === 'home' ? 'Home' : v === 'browse' ? 'Browse advisors' : 'Browse advisors / ' + cur.title,\n      goHome: go('home'), goBrowse: go('browse'),\n      cats: cats.map((c, i) => ({ n: i + 1, row: i + 2, span: (c.min - 6) + ' / ' + (c.max - 5), short: c.short, link: 'Browse ' + (c.short === 'SAT' ? 'SAT' : c.short.toLowerCase()) + ' advisors', gl: 'Grades ' + c.min + '–' + c.max, grades: c.min + '–' + c.max, color: c.color, tint: c.tint, ink: c.ink, purpose: c.purpose, note: c.note, title: c.title, op: on(c) ? 1 : 0.3, open: go('list', c.id), tip: s.tip === c.id, enter: () => this.setState({ tip: c.id }), leave: () => this.setState({ tip: null }) })),\n      cur: { n: cats.indexOf(cur) + 1, title: cur.title, purpose: cur.purpose, color: cur.color, tint: cur.tint, ink: cur.ink, gl: 'Grades ' + cur.min + '–' + cur.max },\n      advisors: cur.list,\n      grades: [8, 9, 10, 11, 12].map(n => ({ n, bg: g === n ? '#17392F' : '#fff', fg: g === n ? '#F7F3EA' : '#17392F', pick: () => this.setState({ grade: g === n ? null : n }) })),\n      gradeCols: [8, 9, 10, 11, 12].map(n => ({ n, line: g === n ? '#B85C3D' : 'rgba(32,37,34,0.12)' })),\n      resources: [\n        { tag: 'SAT', title: 'Test timeline and study plan', tint: '#EAF0EC' },\n        { tag: 'College essay', title: 'Essay prompts and examples', tint: '#F3DED4' },\n        { tag: 'College guidance', title: 'Application timeline by grade', tint: '#DCE3DA' },\n        { tag: 'Passion project', title: 'Project ideas and how to start', tint: '#F4E8CF' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
