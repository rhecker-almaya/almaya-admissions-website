<!DOCTYPE html>
<html>
<head>

<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1608113310765242&ev=PageView&noscript=1"></noscript>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" href="assets/almayya-mark.png">
<link rel="apple-touch-icon" href="assets/almayya-mark.png">
<meta name="description" content="Meet your Almaya Admissions advisor. The first college application marketplace built to find your trained mentor at a budget that works for you.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Almaya Admissions">
<meta property="og:title" content="Advisor | Almaya Admissions">
<meta property="og:image" content="https://almayaadmissions.com/assets/og-preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://almayaadmissions.com/assets/og-preview.jpg">
<link rel="stylesheet" href="site.css">
<script src="site-mobile-nav.js"></script>
<script src="site-header.js"></script>
<script src="site-footer.js"></script>
<script src="tutors.js"></script>
<script src="booking-modal.js"></script>
<link rel="stylesheet" href="_ds/almayya-design-system-fd8d1095-46c7-4c57-8c53-7c1d0ae8ae0d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/almayya-design-system-fd8d1095-46c7-4c57-8c53-7c1d0ae8ae0d/tokens/colors.css">
<link rel="stylesheet" href="_ds/almayya-design-system-fd8d1095-46c7-4c57-8c53-7c1d0ae8ae0d/tokens/typography.css">
<link rel="stylesheet" href="_ds/almayya-design-system-fd8d1095-46c7-4c57-8c53-7c1d0ae8ae0d/tokens/spacing.css">

<script src="_ds/almayya-design-system-fd8d1095-46c7-4c57-8c53-7c1d0ae8ae0d/_ds_bundle.js"></script>
<style>
@media (max-width:860px){.nav-links{display:none!important}}
body{margin:0;background:var(--ivory)}
a{color:var(--copper)}
a:hover{color:var(--copper-600)}
</style>
</helmet>
<div style="min-height:100vh;background:var(--ivory);font-family:var(--font-sans-body);color:var(--charcoal)">
<x-import component-from-global-scope="SiteHeader" hint-size="100%,80px"></x-import>
<sc-if value="{{ slug }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="TutorProfile" data-slug="{{ slug }}" hint-size="100%,1400px"></x-import></sc-if>
</div>

<x-import component-from-global-scope="SiteFooter" data-book="off" hint-size="100%,420px"></x-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:1100}}">
class Component extends DCLogic {
  get slug() { return new URLSearchParams(location.search).get('a') || 'josh-w'; }
  componentDidMount() { const t = (window.AM_TUTORS || []).find(x => x.slug === this.slug); if (t) document.title = t.name + ' | Almaya Admissions'; }
  renderVals() { return { slug: this.slug }; }
}
</script>
</body>
</html>
